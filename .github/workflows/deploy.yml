name: Deploy to Oracle Instance

on:
  push:
    branches: [main]

jobs:
  deploy:
    environment: oracle-instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The instance has under 1GB of RAM, which a Vite production build can
      # exhaust. Building here and shipping only the finished dist/ keeps the
      # server out of it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Caddy runs as its own user and cannot traverse /home/ubuntu (750),
      # so the build is published to a web root it can read.
      - name: Publish frontend build
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          rsync -a --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/space-body-simulator/"

      - name: Rebuild backend via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd dev/space-body-simulator
            git fetch --all
            git reset --hard origin/main
            sudo docker compose up -d --build backend
